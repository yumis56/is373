name: Update Content

on: 
  push:
    branches:
      - main   
      
permissions:
    contents: write
    
jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger is373-project Workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yumis56/is373-project/dispatches \
            -d '{"event_type":"update_content","client_payload":{}}'
